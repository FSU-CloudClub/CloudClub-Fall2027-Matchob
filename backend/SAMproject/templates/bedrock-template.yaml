AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Suggestions service - API and Bedrock Lambda

Parameters:
  UserPoolArn:
    Type: String
  # IDs of the prompt and guardrail made in the Bedrock console. Set in samconfig.toml.
  PromptArn:
    Type: String
  BedrockModelResourceArns:
    Type: CommaDelimitedList
    Description: Exact model and inference profile ARNs required by the prompt.
  GuardrailId:
    Type: String
  GuardrailVersion:
    Type: String

Globals:
  Function:
    Layers:
      - !Ref SharedLayer
    Runtime: python3.13
    # Inside API Gateway's 29 s limit, above the Bedrock client's 25 s read_timeout.
    Timeout: 28
    Environment:
      Variables:
        POWERTOOLS_LOG_LEVEL: INFO
        PROMPT_ARN: !Ref PromptArn
        GUARDRAIL_ID: !Ref GuardrailId
        GUARDRAIL_VERSION: !Ref GuardrailVersion

Resources:
  SharedLayer:
    Type: AWS::Serverless::LayerVersion
    Properties:
      ContentUri: ../src/shared
      CompatibleRuntimes:
        - python3.13
    Metadata:
      BuildMethod: python3.13

  BedrockApi:
    Type: AWS::Serverless::Api
    Properties:
      StageName: dev
      Auth:
        DefaultAuthorizer: CognitoAuthorizer
        Authorizers:
          CognitoAuthorizer:
            UserPoolArn: !Ref UserPoolArn

  BedrockFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ../src/bedrock-pipeline/
      Handler: app.lambda_handler
      Environment:
        Variables:
          POWERTOOLS_SERVICE_NAME: bedrock
      Policies:
        - Statement:
            - Effect: Allow
              Action: bedrock:RenderPrompt
              Resource: !Ref PromptArn
            - Effect: Allow
              Action: bedrock:InvokeModel
              Resource: !Ref BedrockModelResourceArns
            - Effect: Allow
              Action: bedrock:ApplyGuardrail
              Resource: !Sub "arn:${AWS::Partition}:bedrock:${AWS::Region}:${AWS::AccountId}:guardrail/${GuardrailId}"
      Events:
        CreateSuggestions:
          Type: Api
          Properties:
            RestApiId: !Ref BedrockApi
            Path: /suggestions
            Method: post

Outputs:
  ApiUrl:
    Value: !Sub "https://${BedrockApi}.execute-api.${AWS::Region}.amazonaws.com/dev"
