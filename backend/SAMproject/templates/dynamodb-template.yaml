AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Profile service - users table, API, and profile Lambda

Parameters:
  UploadBucketName:
    Type: String
  UserPoolArn:
    Type: String

Globals:
  Function:
    Layers:
      - !Ref SharedLayer
    Runtime: python3.13
    Timeout: 10
    Environment:
      Variables:
        POWERTOOLS_LOG_LEVEL: INFO
        USERS_TABLE: !Ref MatchobUsersTable
        DYNAMODB_ENDPOINT: ""

Resources:
  SharedLayer:
    Type: AWS::Serverless::LayerVersion
    Properties:
      ContentUri: ../src/shared
      CompatibleRuntimes:
        - python3.13
    Metadata:
      BuildMethod: python3.13

  MatchobUsersTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: MatchobUsers
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: userId
          AttributeType: S
      KeySchema:
        - AttributeName: userId
          KeyType: HASH

  ProfileApi:
    Type: AWS::Serverless::Api
    Properties:
      StageName: dev
      Auth:
        DefaultAuthorizer: CognitoAuthorizer
        Authorizers:
          CognitoAuthorizer:
            UserPoolArn: !Ref UserPoolArn

  ProfileFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ../src/dynamodb-pipeline/
      Handler: app.lambda_handler
      Environment:
        Variables:
          POWERTOOLS_SERVICE_NAME: profile
          UPLOAD_BUCKET: !Ref UploadBucketName
          S3_ENDPOINT: ""
      Policies:
        - Statement:
            - Effect: Allow
              Action: s3:DeleteObject
              Resource: !Sub "arn:${AWS::Partition}:s3:::${UploadBucketName}/users/*/resumes/*"
            - Effect: Allow
              Action:
                - dynamodb:GetItem
                - dynamodb:PutItem
                - dynamodb:UpdateItem
                - dynamodb:DeleteItem
              Resource: !GetAtt MatchobUsersTable.Arn
      Events:
        GetProfile:
          Type: Api
          Properties:
            RestApiId: !Ref ProfileApi
            Path: /profile
            Method: get
        CreateUser:
          Type: Api
          Properties:
            RestApiId: !Ref ProfileApi
            Path: /profile
            Method: post
        UpdateProfile:
          Type: Api
          Properties:
            RestApiId: !Ref ProfileApi
            Path: /profile
            Method: put
        DeleteProfile:
          Type: Api
          Properties:
            RestApiId: !Ref ProfileApi
            Path: /profile
            Method: delete

Outputs:
  ApiUrl:
    Value: !Sub "https://${ProfileApi}.execute-api.${AWS::Region}.amazonaws.com/dev"
  UsersTableName:
    Value: !Ref MatchobUsersTable
