AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Resumes service - uploads bucket, API, and resumes Lambda

Parameters:
  UploadBucketName:
    Type: String
  UserPoolArn:
    Type: String
  UsersTableName:
    Type: String

Globals:
  Function:
    Layers:
      - !Ref SharedLayer
    Runtime: python3.13
    Timeout: 10
    Environment:
      Variables:
        POWERTOOLS_LOG_LEVEL: INFO
        USERS_TABLE: !Ref UsersTableName
        UPLOAD_BUCKET: !Ref UploadBucketName
        DYNAMODB_ENDPOINT: ""
        S3_ENDPOINT: ""
        S3_PUBLIC_ENDPOINT: ""

Resources:
  SharedLayer:
    Type: AWS::Serverless::LayerVersion
    Properties:
      ContentUri: ../src/shared
      CompatibleRuntimes:
        - python3.13
    Metadata:
      BuildMethod: python3.13

  # Private bucket for resume files. The browser uploads and downloads with presigned URLs,
  # so it needs CORS for PUT and GET, but nothing in it is public.
  UploadBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Ref UploadBucketName
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      LifecycleConfiguration:
        Rules:
          - Id: ExpireQuarantinedUploads
            Status: Enabled
            Prefix: quarantine/
            ExpirationInDays: 1
            AbortIncompleteMultipartUpload:
              DaysAfterInitiation: 1
          - Id: ExpireUncommittedValidationCopies
            Status: Enabled
            TagFilters:
              - Key: validation
                Value: pending
            ExpirationInDays: 1
      CorsConfiguration:
        CorsRules:
          - AllowedMethods:
              - GET
              - PUT
            AllowedOrigins:
              - "*"
            AllowedHeaders:
              - "*"
            MaxAge: 3000

  ResumesApi:
    Type: AWS::Serverless::Api
    Properties:
      StageName: dev
      Auth:
        DefaultAuthorizer: CognitoAuthorizer
        Authorizers:
          CognitoAuthorizer:
            UserPoolArn: !Ref UserPoolArn

  ResumesFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ../src/s3-pipeline/
      Handler: app.lambda_handler
      Environment:
        Variables:
          POWERTOOLS_SERVICE_NAME: resumes
      Policies:
        - Version: '2012-10-17'
          Statement:
            # All resume routes share this role. Metadata is read or updated
            # within an existing profile; no table scans or profile deletion.
            - Sid: ReadAndUpdateResumeMetadata
              Effect: Allow
              Action:
                - dynamodb:GetItem
                - dynamodb:UpdateItem
              Resource: !Sub 'arn:${AWS::Partition}:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${UsersTableName}'
            - Sid: UploadToQuarantine
              Effect: Allow
              Action: s3:PutObject
              Resource: !Sub 'arn:${AWS::Partition}:s3:::${UploadBucketName}/quarantine/users/*/resumes/*'
            - Sid: DownloadValidatedFiles
              Effect: Allow
              Action: s3:GetObject
              Resource: !Sub 'arn:${AWS::Partition}:s3:::${UploadBucketName}/users/*/resumes/*/validated/*'
            - Sid: DeleteResumeFiles
              Effect: Allow
              Action: s3:DeleteObject
              Resource:
                - !Sub 'arn:${AWS::Partition}:s3:::${UploadBucketName}/users/*/resumes/*'
                - !Sub 'arn:${AWS::Partition}:s3:::${UploadBucketName}/quarantine/users/*/resumes/*'
      Events:
        ListResumes:
          Type: Api
          Properties:
            RestApiId: !Ref ResumesApi
            Path: /resumes
            Method: get
        CreateUploadUrl:
          Type: Api
          Properties:
            RestApiId: !Ref ResumesApi
            Path: /resumes/upload-url
            Method: post
        UpdateResume:
          Type: Api
          Properties:
            RestApiId: !Ref ResumesApi
            Path: /resumes/{resumeId}
            Method: patch
        DeleteResume:
          Type: Api
          Properties:
            RestApiId: !Ref ResumesApi
            Path: /resumes/{resumeId}
            Method: delete
        CreateDownloadUrl:
          Type: Api
          Properties:
            RestApiId: !Ref ResumesApi
            Path: /resumes/{resumeId}/download-url
            Method: get

  UploadValidationFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ../src/s3-pipeline/
      Handler: upload_validator.lambda_handler
      Timeout: 30
      MemorySize: 512
      Policies:
        - Version: '2012-10-17'
          Statement:
            - Effect: Allow
              Action:
                - dynamodb:GetItem
                - dynamodb:UpdateItem
              Resource: !Sub 'arn:${AWS::Partition}:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${UsersTableName}'
            - Effect: Allow
              Action:
                - s3:GetObject
                - s3:DeleteObject
              Resource: !Sub 'arn:${AWS::Partition}:s3:::${UploadBucketName}/quarantine/users/*/resumes/*'
            - Effect: Allow
              Action:
                - s3:PutObject
                - s3:DeleteObject
                - s3:PutObjectTagging
                - s3:DeleteObjectTagging
              Resource: !Sub 'arn:${AWS::Partition}:s3:::${UploadBucketName}/users/*/resumes/*/validated/*'
      Events:
        QuarantineUpload:
          Type: S3
          Properties:
            Bucket: !Ref UploadBucket
            Events: s3:ObjectCreated:*
            Filter:
              S3Key:
                Rules:
                  - Name: prefix
                    Value: quarantine/

Outputs:
  ApiUrl:
    Value: !Sub "https://${ResumesApi}.execute-api.${AWS::Region}.amazonaws.com/dev"
  UploadBucketName:
    Value: !Ref UploadBucket
