# defines the services (dynamoDB and S3) and the network for local testing
name: matchob # compose project name

services:
  dynamodb:
    image: amazon/dynamodb-local:3.3.1 # pulled from docker registry
    container_name: matchob-dynamodb 
    command: ["-jar", "DynamoDBLocal.jar", "-sharedDb", "-inMemory"]
    ports:
      - "${DYNAMODB_PORT:-8000}:8000"
  dynamodb-init:
    image: amazon/aws-cli:2.37.13
    depends_on:
      - dynamodb
    environment:
      - AWS_ACCESS_KEY_ID=local
      - AWS_SECRET_ACCESS_KEY=local
      - AWS_DEFAULT_REGION=us-east-1
      - AWS_ENDPOINT_URL_DYNAMODB=http://dynamodb:8000
      - AWS_PAGER=
    volumes:
      - ./docker/seed:/seed:ro # to get read-only(ro) data
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -e
        until aws dynamodb list-tables >/dev/null; do echo "waiting for dynamodb..."; sleep 1; done
        aws dynamodb describe-table --table-name MatchobUsers >/dev/null 2>&1 || \
          aws dynamodb create-table \
            --table-name MatchobUsers \
            --attribute-definitions AttributeName=userId,AttributeType=S \
            --key-schema AttributeName=userId,KeyType=HASH \
            --billing-mode PAY_PER_REQUEST
        aws dynamodb wait table-exists --table-name MatchobUsers
        aws dynamodb batch-write-item --request-items file:///seed/users.json
        echo "seed complete"
  s3:
    image: adobe/s3mock:5.2.3
    container_name: matchob-s3
    ports:
      - "${S3_PORT:-9090}:9090"
    environment:
      - COM_ADOBE_TESTING_S3MOCK_STORE_INITIAL_BUCKETS=${UPLOAD_BUCKET:-matchob-uploads}

networks:
  default:
    name: matchob-local
    