AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Matchob backend - root stack that wires the service stacks together

# IDs of the prompt and guardrail made in the Bedrock console. Set them with
# parameter_overrides in samconfig.toml. See docs/bedrock-pipeline/README.md.
Parameters:
  PromptArn:
    Type: String
  GuardrailId:
    Type: String
  GuardrailVersion:
    Type: String

Resources:
  SharedStack:
    Type: AWS::Serverless::Application
    Properties:
      Location: templates/shared-template.yaml

  ProfileStack:
    Type: AWS::Serverless::Application
    Properties:
      Location: templates/dynamodb-template.yaml
      Parameters:
        UserPoolArn: !GetAtt SharedStack.Outputs.UserPoolArn

  ResumesStack:
    Type: AWS::Serverless::Application
    Properties:
      Location: templates/s3-template.yaml
      Parameters:
        UserPoolArn: !GetAtt SharedStack.Outputs.UserPoolArn
        UsersTableName: !GetAtt ProfileStack.Outputs.UsersTableName

  BedrockStack:
    Type: AWS::Serverless::Application
    Properties:
      Location: templates/bedrock-template.yaml
      Parameters:
        UserPoolArn: !GetAtt SharedStack.Outputs.UserPoolArn
        PromptArn: !Ref PromptArn
        GuardrailId: !Ref GuardrailId
        GuardrailVersion: !Ref GuardrailVersion

Outputs:
  UserPoolId:
    Value: !GetAtt SharedStack.Outputs.UserPoolId
  UserPoolClientId:
    Value: !GetAtt SharedStack.Outputs.UserPoolClientId
  ProfileApiUrl:
    Value: !GetAtt ProfileStack.Outputs.ApiUrl
  ResumesApiUrl:
    Value: !GetAtt ResumesStack.Outputs.ApiUrl
  SuggestionsApiUrl:
    Value: !GetAtt BedrockStack.Outputs.ApiUrl
