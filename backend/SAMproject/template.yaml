
AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31

Globals:
  Function:
    Layers: 
      - !Ref SharedLayer
    Runtime: python3.13
    Timeout: 10
    Environment:
      Variables:
        USERS_TABLE: !Ref MatchobUsersTable
        DYNAMODB_ENDPOINT: ""
        S3_ENDPOINT: ""

Resources:

  # Database for user profiles
  MatchobUsersTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: MatchobUsers
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: userId
          AttributeType: S
      KeySchema:
        - AttributeName: userId
          KeyType: HASH

  # Cognito User Pool
  MatchobUserPool:
    Type: AWS::Cognito::UserPool
    Properties:
      UserPoolName: matchob-dev-users
      UsernameAttributes:
        - email
      AutoVerifiedAttributes:
        - email
      Policies:
        PasswordPolicy:
          MinimumLength: 12

  # Frontend application client
  MatchobUserPoolClient:
    Type: AWS::Cognito::UserPoolClient
    Properties:
      UserPoolId: !Ref MatchobUserPool
      ClientName: matchob-frontend
      GenerateSecret: false
      AllowedOAuthFlowsUserPoolClient: true
      AllowedOAuthFlows:
        - code
      AllowedOAuthScopes:
        - openid
        - email
        - profile
      CallbackURLs:
        - http://localhost:3000/auth/callback
      LogoutURLs:
        - http://localhost:3000/
      SupportedIdentityProviders:
        - COGNITO

  # API Gateway with Cognito authorization
  MatchobApi:
    Type: AWS::Serverless::Api
    Properties:
      StageName: dev
      Auth:
        DefaultAuthorizer: CognitoAuthorizer
        Authorizers:
          CognitoAuthorizer:
            UserPoolArn: !GetAtt MatchobUserPool.Arn


  # Lambda for retrieving user profiles and core metadata
  GetProfileFunction:                              # Logical name of the Lambda function
    Type: AWS::Serverless::Function                # Creates an AWS Lambda using SAM
    Properties:                                    # Lambda configuration
      CodeUri: src/dynamodb-pipeline/               # Folder containing our app.py
      Handler: app.lambda_handler                  # Python function AWS executes

      Policies:                                    # Permissions granted to the Lambda
        - DynamoDBReadPolicy:                      # Allows DynamoDB read operations
            TableName: !Ref MatchobUsersTable      # References the existing users table

      Events:                                      # API Gateway routes
        GetProfile:                                # Existing profile endpoint
          Type: Api                                # API Gateway event
          Properties:                              # Event configuration
            RestApiId: !Ref MatchobApi             # Uses the existing API
            Path: /profile                         # GET /profile URL
            Method: get                            # HTTP GET request

        GetCoreMetadata:                           # New core metadata endpoint
          Type: Api                                # API Gateway event
          Properties:                              # Event configuration
            RestApiId: !Ref MatchobApi             # Uses the existing API
            Path: /profile/core                    # GET /profile/core URL
            Method: get                            # HTTP GET request

  MatchobUserPoolDomain:
    Type: AWS::Cognito::UserPoolDomain
    Properties:
      Domain: matchob-dev-backend
      UserPoolId: !Ref MatchobUserPool
  SharedLayer:
    Type: AWS::Serverless::LayerVersion
    Properties:
      LayerName: matchob-shared
      ContentUri: src/shared
      CompatibleRuntimes:
        - python3.13
    Metadata:
      BuildMethod: python3.13

Outputs:
  UserPoolId:
    Value: !Ref MatchobUserPool

  UserPoolClientId:
    Value: !Ref MatchobUserPoolClient

  ApiUrl:
    Value: !Sub "https://${MatchobApi}.execute-api.${AWS::Region}.amazonaws.com/dev/profile"
